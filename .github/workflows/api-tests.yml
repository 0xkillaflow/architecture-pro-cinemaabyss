name: API Tests

on:
  push:
    branches: [ main, master, cinema ]
  pull_request:
    branches: [ main, master, cinema ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'docker'
        type: choice
        options:
          - local
          - docker
      test_folder:
        description: 'Test folder to run (leave empty for all)'
        required: false
        type: string

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Compose
        run: |
          docker compose --version
      
      - name: Start services with Docker Compose
        run: |
          # --wait ждёт healthy для postgres и running для остальных,
          # и падает, если контейнер умер на старте
          docker compose up -d --wait --wait-timeout 180

      - name: Wait for HTTP endpoints
        run: |
          for url in http://localhost:8080/health \
                     http://localhost:8081/api/movies/health \
                     http://localhost:8082/api/events/health \
                     http://localhost:8000/health; do
            echo "waiting for $url"
            for i in $(seq 1 30); do
              curl -fsS "$url" > /dev/null && { echo "  ok"; break; }
              [ "$i" = 30 ] && { echo "  TIMEOUT"; exit 1; }
              sleep 2
            done
          done

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: tests/postman/package-lock.json
      
      - name: Install Newman and dependencies
        working-directory: tests/postman
        run: npm install
      
      - name: Run API tests
        working-directory: tests/postman
        run: |
          docker build -t cinemaabyss-api-tests .
          docker run --rm --network=cinemaabyss-network \
            -v "$(pwd)/reports:/app/reports" cinemaabyss-api-tests

      - name: Stop services
        if: always()
        run: docker compose down